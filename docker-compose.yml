services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: hackathon_matching
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon_matching"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://hackathon:hackathon@postgres:5432/hackathon_matching
    depends_on:
      postgres:
        condition: service_healthy
    # "Zdrowy" = backend odpowiada I dogaduje się z bazą (/health/ready, #91),
    # a nie tylko "proces żyje". Obraz python:slim nie ma curla, więc pytamy
    # Pythonem: urlopen rzuca wyjątkiem przy 503, czyli healthcheck oblewa.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    # Frontend startuje dopiero, gdy backend dogaduje się z bazą - bez tego
    # frontend mógł wstać przed backendem. Tabel to nie zakłada: /health/ready
    # pyta o połączenie, więc na świeżej bazie trzeba jeszcze uruchomić
    # migracje (README, "Uruchomienie w Dockerze").
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
