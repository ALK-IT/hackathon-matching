# Backend i migracje to ten sam Dockerfile i ta sama baza - trzymamy to w
# jednym miejscu, żeby adresy nie rozjechały się między usługami.
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    - PYTHONUNBUFFERED=1
    - DATABASE_URL=postgresql+asyncpg://hackathon:hackathon@postgres:5432/hackathon_matching

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: hackathon_matching
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon_matching"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Jednorazowe założenie/uzupełnienie tabel przed startem backendu. Bez tego
  # świeża baza nie ma tabel, backend jest "niezdrowy" (/health/ready sprawdza
  # też migracje, #91) i frontend w ogóle nie startuje. Na migracjach, które
  # już są wykonane, kończy się od razu i nic nie zmienia.
  #
  # Gdy baza jest NOWSZA niż kod (powrót na starszą gałąź, wycofane wdrożenie),
  # alembic nie rozpozna jej wersji i przerwie - a wtedy nie wstanie cały stos.
  # Jak z tego wyjść: README, "Uruchomienie w Dockerze".
  #
  # To ustawienie jest wyłącznie lokalne - Railway nie czyta tego pliku, tam
  # migracje uruchamia Pre-Deploy Command (README, sekcja Deploy).
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # "Zdrowy" = backend odpowiada, dogaduje się z bazą, a baza ma wykonane
    # wszystkie migracje (/health/ready, #91) - a nie tylko "proces żyje".
    # Obraz python:slim nie ma curla, więc pytamy Pythonem: urlopen rzuca
    # wyjątkiem przy 503, czyli healthcheck oblewa.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    # Frontend startuje dopiero, gdy backend jest gotowy - bez tego mógł wstać
    # przed nim, a pierwsze otwarcie strony kończyło się błędem listy.
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
