name: backend-ci

on:
  # Bez filtra paths na pull_request: required status check musi się pojawić
  # na KAŻDYM PR, inaczej branch protection wisi na "oczekiwany" check w nieskończoność
  # dla PR-ów, które nie dotykają backend/.
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hackathon
          POSTGRES_PASSWORD: hackathon
          POSTGRES_DB: hackathon_matching
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackathon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hackathon:hackathon@localhost:5432/hackathon_matching
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      # Migracje przed testami: baza w CI startuje pusta, a testy endpointow
      # potrzebuja prawdziwych tabel. Przy okazji sprawdza, czy migracje da sie
      # zastosowac - bledna migracja zatrzyma sie tutaj, a nie na produkcji.
      - run: alembic upgrade head
      - run: pytest
