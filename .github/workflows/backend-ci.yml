name: backend-ci

on:
  # Bez filtra paths na pull_request: required status check musi się pojawić
  # na KAŻDYM PR, inaczej branch protection wisi na "oczekiwany" check w nieskończoność
  # dla PR-ów, które nie dotykają backend/.
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest
