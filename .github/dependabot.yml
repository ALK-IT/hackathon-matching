version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 to na razie beta, koliduje z typescript-eslint (peer dep <6.1.0).
      - dependency-name: "typescript"
        versions: ["7.x"]
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
