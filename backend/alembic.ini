# Konfiguracja Alembica - migracje schematu bazy danych.
# Uruchamianie z katalogu backend/, np. `alembic upgrade head`.
#
# Uwaga: komentarze w tym pliku sa celowo bez polskich znakow. configparser
# czyta .ini w domyslnym kodowaniu systemu, ktore na Windowsie nie jest UTF-8.

[alembic]
# Katalog ze skryptami migracji, liczony wzgledem polozenia tego pliku.
script_location = %(here)s/alembic

# Dodaje backend/ do sys.path, dzieki czemu env.py moze zrobic `from app.db import ...`.
prepend_sys_path = .

path_separator = os

# sqlalchemy.url jest tu CELOWO nieustawiony.
#
# Adres bazy razem z haslem przychodzi ze zmiennej srodowiskowej DATABASE_URL
# i jest wstrzykiwany w alembic/env.py. Wpisanie go tutaj oznaczaloby
# zacommitowanie poswiadczen do repozytorium - gitleaks w CI zapalilby sie
# na tym natychmiast (patrz SECURITY.md).

# Migracje generowane przez `alembic revision --autogenerate` sa od razu
# formatowane blackiem, z ta sama dlugoscia linii co reszta backendu
# (line-length = 100 w pyproject.toml). Bez tego pierwsza wygenerowana migracja
# wywrocilaby krok `black --check .` w workflow backend-ci.
[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

# Konfiguracja logowania, czytana przez alembic/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
